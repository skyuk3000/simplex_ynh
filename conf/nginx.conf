# SimpleX informational page, protected by the YunoHost main permission.
# SimpleX generates root-relative HTML links; adjust them for a subpath.
#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
# Administrator-only monitoring UI; use the same YunoHost permission as the app.
location __PATH__/monitor/ {
    proxy_pass http://127.0.0.1:__PORT_DASHBOARD__/;
    include proxy_params_with_auth;
    proxy_set_header Host $host;
    proxy_redirect off;
}
location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT_WEB__/;
    include proxy_params_with_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_redirect off;

    # Assets and navigation links such as /media/style.css and /contact/
    # must stay under the app's /simplex/ prefix.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/' 'href="__PATH__/';
    sub_filter 'src="/' 'src="__PATH__/';
    sub_filter 'action="/' 'action="__PATH__/';
    # Add a direct navigation link to the protected read-only dashboard.
    # Generated SimpleX pages are regenerated at startup, so inject the link
    # at the proxy layer instead of modifying generated HTML files.
    sub_filter '</body>' '<a href="__PATH__/monitor/" style="position:fixed;right:1rem;bottom:1rem;z-index:1000;padding:.7rem 1rem;background:#146ac4;color:#fff;text-decoration:none;border-radius:.6rem;box-shadow:0 2px 8px #0003;font:600 14px system-ui,sans-serif">Monitoring dashboard</a></body>';
}
