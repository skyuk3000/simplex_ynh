# SimpleX informational page, restricted by the YunoHost main permission.
# Strip the installation subpath before proxying to the embedded HTTP server.
#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT_WEB__/;
    include proxy_params_with_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
