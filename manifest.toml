packaging_format = 2

id = "simplex"
name = "SimpleX"
description.en = "Messaging platform operating without user identifiers"
description.fr = "Plate-forme de messagerie fonctionnant sans identifiants d'utilisateurs"

version = "6.5.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
website = "https://simplex.chat/"
admindoc = "https://github.com/simplex-chat/simplex-chat/blob/stable/docs/SERVER.md"
code = "https://github.com/simplex-chat/simplexmq"
cpe = "cpe:2.3:a:simplex:simplex_chat"
fund = "https://opencollective.com/simplex-chat"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "150M"
ram.runtime = "50M"

[install]

[resources]

 [resources.sources]

   [resources.sources.main]
   amd64.url = "https://github.com/simplex-chat/simplexmq/releases/download/v6.5.0/smp-server-ubuntu-24_04-x86-64"
   amd64.sha256 = "0ec0984a9f15d8a140c96e0c84948e37f581ed0a0140e6fc1d5677dcc9e5144c"
   arm64.url = "https://github.com/simplex-chat/simplexmq/releases/download/v6.5.0/smp-server-ubuntu-24_04-aarch64"
   arm64.sha256 = "f7c27a765dc34cb9c9ee9e220f2cfb3ea4005f24a2991a0be16b676620e13fa6"
   in_subdir = false
   extract = false
   rename = "smp-server"

   [resources.sources.xftp]
   amd64.url = "https://github.com/simplex-chat/simplexmq/releases/download/v6.5.0/xftp-server-ubuntu-22_04-x86-64"
   amd64.sha256 = "24e5fe8645ba1dfe9af7aa3cd9d5019af88411ab54dfb4b8c93cadefa552d512"
   arm64.url = "https://github.com/simplex-chat/simplexmq/releases/download/v6.5.0/xftp-server-ubuntu-22_04-aarch64"
   arm64.sha256 = "36382269e1afed41ef061c5c3b65e58d73dbfa176424f464e002367c5bedb02b"
   in_subdir = false
   extract = false
   rename = "xftp-server"

    [resources.ports]
    main.default = 5223
    main.exposed = "TCP"
    xftp.default = 5224
    xftp.exposed = "TCP"

    [resources.system_user]

    [resources.install_dir]
    dir = "/usr/local/bin/__APP__"

    [resources.data_dir]

    [resources.permissions]
